name: Agent guidance checks
on:
  push:
    branches: [main]
    paths: ['AGENTS.md', '.agents/**', 'docs/**', '.github/workflows/agent-guidance.yml']
  pull_request:
    paths: ['AGENTS.md', '.agents/**', 'docs/**', '.github/workflows/agent-guidance.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: python3 .agents/test_check_guidance.py
      - run: python3 .agents/check_guidance.py
