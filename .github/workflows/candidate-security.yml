name: Candidate security evidence
on:
  push:
    branches: ['release/0.1']
    paths: ['rust/Cargo.lock', 'acceptance/audit_cargo.py', 'acceptance/test_audit_cargo.py', 'acceptance/runtime_upgrade_evidence.py', 'acceptance/runtime_evidence.py', '.github/workflows/candidate-security.yml']
  pull_request:
    branches: [main]
    paths: ['rust/**', 'acceptance/**', '.github/workflows/candidate-security.yml']
permissions:
  contents: read
jobs:
  cargo-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s acceptance -p test_audit_cargo.py -v
      - run: python acceptance/audit_cargo.py --lock rust/Cargo.lock --output cargo-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cargo-advisory-evidence
          path: cargo-audit.json
          if-no-files-found: error
  patched-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [windows, macos, linux]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python acceptance/runtime_upgrade_evidence.py ${{ matrix.target }} > patched-runtime.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: patched-runtime-${{ matrix.target }}
          path: patched-runtime.json
          if-no-files-found: error
