name: Candidate build dependency evidence
on:
  push:
    branches: ['integration/standalone-preview-20261125']
    paths:
      - '.github/workflows/dependency-evidence.yml'
      - 'acceptance/dependency_evidence.py'
      - 'acceptance/test_dependency_evidence.py'
permissions:
  contents: read
jobs:
  candidate-lock:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            target: macos
          - os: ubuntu-24.04
            arch: x86_64
            target: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: python -c "import os,platform; assert platform.machine().lower() == os.environ['EXPECTED_ARCH']"
      - run: python -m unittest discover -s acceptance -p test_dependency_evidence.py -v
      - name: Resolve and verify candidate wheel hashes without installing
        run: python acceptance/dependency_evidence.py ${{ matrix.target }}
