name: Model research pilot (no training)
on:
  push:
    branches: ['research/specialized-model']
    paths: ['training/build_grounded_pilot.py', 'training/test_grounded_pilot.py', '.github/workflows/model-research.yml']
  pull_request:
    paths: ['training/build_grounded_pilot.py', 'training/test_grounded_pilot.py', '.github/workflows/model-research.yml']
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s training -p test_grounded_pilot.py -v
      - run: python training/build_grounded_pilot.py --output pilot-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-synthetic-pilot
          path: pilot-output/
          if-no-files-found: error
          retention-days: 14
