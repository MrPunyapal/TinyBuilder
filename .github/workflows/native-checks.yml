name: Native deterministic checks
on:
  pull_request:
  push:
    branches: [main, feat/cross-platform-ci]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: AMD64
          - os: macos-15
            arch: arm64
          - os: ubuntu-24.04
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify native architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: python -c "import os, platform; print(platform.platform(), platform.machine()); assert platform.machine().lower() == os.environ['EXPECTED_ARCH'].lower()"
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s acceptance -p "test_*.py" -v
      - run: python -m compileall -q tinybuilder benchmarks acceptance
      - run: python -m tinybuilder --help
      - run: python -m tinybuilder doctor --project .
