name: Native candidate packages
on:
  push:
    branches: [main, 'release/0.1']
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['rust/**', 'acceptance/package_native.py', 'acceptance/test_package_native.py', 'acceptance/qualify_packaged_read.py', 'acceptance/test_qualify_packaged_read.py', 'acceptance/llama-b12359-*', 'acceptance/runtime_upgrade_evidence.py', 'acceptance/test_runtime_upgrade_evidence.py', 'acceptance/runtime_evidence.py', 'tinybuilder/runtime/catalog.py', 'docs/CANDIDATE_QUICKSTART.md', '.github/workflows/native-package.yml']
permissions:
  contents: read
concurrency:
  group: native-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: rustup override set 1.88.0
      - run: python -m unittest discover -s acceptance -p test_runtime_evidence.py -v
      - run: python -m unittest discover -s acceptance -p test_runtime_upgrade_evidence.py -v
      - run: python -m unittest discover -s acceptance -p test_package_native.py -v
      - run: python -m unittest discover -s acceptance -p test_qualify_packaged_read.py -v
      - run: python acceptance/package_native.py --target ${{ matrix.target }} --source-commit ${{ github.sha }} --output candidate-dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unqualified-native-${{ matrix.target }}-${{ github.sha }}
          path: candidate-dist/
          if-no-files-found: error
          retention-days: 14
