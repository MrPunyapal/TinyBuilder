name: Portable evaluator trusted controls
on:
  pull_request:
    branches: [main]
    paths: ['lab/portable-evaluator/**', '.github/workflows/portable-evaluator.yml']
  push:
    branches: [main]
    paths: ['lab/portable-evaluator/**', '.github/workflows/portable-evaluator.yml']
permissions:
  contents: read

# Reviewed embedded controls only. No generated modules, model, private fixtures,
# host privileges, external sandbox provisioning or untrusted request payloads.
jobs:
  resolution:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: rustup toolchain install 1.95.0 --profile minimal
      - name: Resolve one shared lock (bootstrap until reviewed lock is committed)
        shell: bash
        working-directory: lab/portable-evaluator
        run: |
          set -euo pipefail
          if [ ! -f Cargo.lock ]; then
            echo "::warning::Bootstrap resolution; not a committed reproducible lock or qualification"
            cargo +1.95.0 generate-lockfile
          fi
          cargo +1.95.0 metadata --locked --format-version 1 > dependency-metadata.json
          cargo +1.95.0 tree --locked -e features > feature-tree.txt
          sha256sum Cargo.lock
          echo 'BEGIN PORTABLE EVALUATOR LOCK'
          cat Cargo.lock
          echo 'END PORTABLE EVALUATOR LOCK'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portable-evaluator-resolution
          path: |
            lab/portable-evaluator/Cargo.lock
            lab/portable-evaluator/dependency-metadata.json
            lab/portable-evaluator/feature-tree.txt
          if-no-files-found: error
  controls:
    needs: resolution
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: X64
          - os: windows-2022
            arch: X64
          - os: macos-15
            arch: ARM64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: portable-evaluator-resolution
          path: lab/portable-evaluator
      - name: Verify runner architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          RUNNER_ACTUAL_ARCH: ${{ runner.arch }}
        run: test "$EXPECTED_ARCH" = "$RUNNER_ACTUAL_ARCH"
      - run: rustup toolchain install 1.95.0 --profile minimal
      - name: Locked trusted-control tests
        working-directory: lab/portable-evaluator
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 fetch --locked
          cargo +1.95.0 test --locked --offline --all-targets
          cargo +1.95.0 build --locked --offline --bins
          cargo +1.95.0 run --locked --offline --bin portable-evaluator-supervisor -- trusted-suite > trusted-controls.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: portable-evaluator-controls-${{ matrix.os }}
          path: lab/portable-evaluator/trusted-controls.json
          if-no-files-found: warn
  advisory-evidence:
    needs: resolution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: portable-evaluator-resolution
          path: lab/portable-evaluator
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python acceptance/audit_cargo.py --lock lab/portable-evaluator/Cargo.lock --output portable-evaluator-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: portable-evaluator-advisory-evidence
          path: portable-evaluator-audit.json
          if-no-files-found: error
