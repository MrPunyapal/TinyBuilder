[package]
name = "tinybuilder-portable-evaluator"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
publish = false
description = "Trusted-control-only experimental portable evaluator; not a security-qualified product"

[workspace]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tempfile = "=3.20.0"
wasmtime = { version = "=48.0.10", default-features = false, features = ["anyhow", "cranelift", "runtime", "std", "wat"] }
wasmtime-wasi = { version = "=48.0.10", default-features = false, features = ["p1"] }

[[bin]]
name = "portable-evaluator-supervisor"
path = "src/bin/supervisor.rs"

[[bin]]
name = "portable-evaluator-worker"
path = "src/bin/worker.rs"
