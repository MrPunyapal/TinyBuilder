[package]
name = "tinybuilder"
version = "0.2.0-alpha.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Native local-first coding assistant"

[dependencies]
anyhow = "=1.0.103"
clap = { version = "=4.5.40", features = ["derive"] }
ignore = "=0.4.23"
rayon = "=1.10.0"
rand = "=0.8.6"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
similar = "=2.7.0"
tempfile = "=3.20.0"
ureq = { version = "=2.12.1", default-features = false, features = ["tls", "json"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
